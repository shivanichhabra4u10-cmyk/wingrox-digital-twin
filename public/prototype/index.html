function whyItMatters(n){
  var m = ["Without an agreed goal and baseline, progress cannot be measured.",
   "Growth work that has no protected place in the calendar is the first thing to disappear.",
   "The same trigger produces the same result until a different response is practised.",
   "Capacity is the limit on everything else in the plan.",
   "Judgment that is not explained is priced as execution.",
   "One reversible test produces more career information than months of thinking.",
   "Evidence, not enthusiasm, decides whether to continue.",
   "Value that is never priced stays unpaid.",
   "Authority is built from repeated, documented work.",
   "A network can only help with a request it understands.",
   "Interest is not demand until someone commits.",
   "Fit matters more than momentum.",
   "A decision made on evidence is easier to live with than one made on hope."];
  return m[n] || m[0];
}

function setDeep(path, val){
  var parts = path.split("."), o = S;
  for(var i=0;i<parts.length-1;i++){ if(!o[parts[i]]) o[parts[i]] = {}; o = o[parts[i]]; }
  o[parts[parts.length-1]] = val;
}
function handleField(t){
  if(t && t.getAttribute && t.getAttribute("data-qother")){
    ansOf(parseInt(t.getAttribute("data-qother"),10)).other = t.value; saveState(); return;
  }
  if(t && t.getAttribute && t.getAttribute("data-login")){
    DB.login[t.getAttribute("data-login")] = t.value; DB.login.err = ""; return;
  }
  if(t && t.getAttribute && t.getAttribute("data-cd")){
    var pd = DB.participants[t.getAttribute("data-pid")];
    if(pd){ if(!pd.flow.callDetails) pd.flow.callDetails = {}; pd.flow.callDetails[t.getAttribute("data-cd")] = t.value; saveState(); }
    return;
  }
  if(t && t.getAttribute && t.getAttribute("data-act")==="admPid"){
    DB.adminPid = t.value; saveState(); render(); return;
  }
  var d = t.dataset, v = (t.type==="checkbox") ? t.checked : t.value;
  var touched = false;
  if(d.bind){ setDeep(d.bind, v); touched = true; if(d.bind.indexOf("profile.")===0) S.profileSaved = false; }
  if(d.vfield){ S.validation.items[d.id][d.vfield] = v; S.validation.items[d.id].updated = todayISO(); touched = true; }
  if(d.mfield){
    var mi = S.mirror.insights.filter(function(x){return x.id===d.id;})[0];
    if(mi){ mi[d.mfield] = v; mi.reviewed = todayISO(); touched = true; }
  }
  if(d.chem){ S.coach.chemistry[d.chem] = v; touched = true; }
  if(d.sel){ S.coach[d.sel] = v; touched = true; }
  if(d.qcomment){ ansOf(parseInt(d.qcomment,10)).comment = v; touched = true; }
  if(d.monthly){ S.mirror.monthly[d.monthly] = v; touched = true; }
  if(d.quarterly){ S.mirror.quarterly[d.quarterly] = v; touched = true; }
  if(d.wf){ S.journey.weeks[parseInt(d.week,10)][d.wf] = v; touched = true; }
  if(d.fit){ S.journey.weeks[parseInt(d.week,10)].fit[d.fit] = v; touched = true; }
  if(d.dim !== undefined && d.dimf){
    var st = S.diagnostic.dims[d.dim];
    st[d.dimf] = (d.dimf==="confirmed") ? t.checked : Math.max(0, Math.min(10, parseInt(v,10)||0));
    touched = true;
  }
  if(touched) saveState();
  return touched;
}

document.addEventListener("change", function(e){
  var t = e.target;
  if(t && t.getAttribute && t.getAttribute("data-upl")){
    var file = t.files && t.files[0];
    if(!file) return;
    if(file.type !== "application/pdf"){ toast("Only PDF files can be attached here."); return; }
    var key = t.getAttribute("data-upl"), pid = t.getAttribute("data-pid");
    var rd = new FileReader();
    rd.onload = function(){
      var res = String(rd.result||""), b64 = res.slice(res.indexOf(",")+1);
      var target = DB.participants[pid];
      if(!target.files) target.files = {};
      target.files[key] = {name:file.name, size:Math.round(file.size/1024)+" KB", date:todayISO(),
        builtIn:"", data: b64.length < 2600000 ? b64 : ""};
      if(b64.length >= 2600000) toast("That file is over two megabytes, so only its details were kept.");
      else toast(file.name+" attached.");
      saveState(); render();
    };
    rd.readAsDataURL(file);
    return;
  }
  handleField(t);
  var act = t.getAttribute && t.getAttribute("data-act");
  if(act === "docPriv"){
    S.docs.forEach(function(d){ if(d.id===t.dataset.doc) d.priv = t.value; });
    saveState(); toast("Privacy level updated.");
  }
  if(act === "cmtStatus"){
    var wk = S.journey.weeks[parseInt(t.dataset.week,10)];
    wk.commitments.forEach(function(c){ if(c.id===t.dataset.cmt) c.status = t.value; });
    saveState(); render();
  }
  if(t && t.getAttribute && t.getAttribute("data-sim")){
    simLevers()[t.getAttribute("data-sim")] = parseInt(t.value,10);
    saveState(); render(); return;
  }
  if(act === "priority"){
    S.mirror.priority = (t.value === "__custom") ? "" : t.value;
    saveState(); render();
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    var bd = $("#layer").querySelectorAll(".modal-bd");
    if(bd.length){ closeModal(); return; }
    if(S.ui.notifOpen){ S.ui.notifOpen = false; drawLayers(); }
  }
  if(e.key === "Tab"){
    var all = $("#layer").querySelectorAll(".modal-bd");
    if(!all.length) return;
    var m = all[all.length-1].querySelector(".modal");
    var f = m.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if(!f.length) return;
    var first = f[0], last = f[f.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    else if(!m.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
  }
});

}

function demoWeek(){
  if(!S.coach.packReleased){ toast("Complete the coach match first."); return; }
  var n = -1;
  for(var i=0;i<WEEKS.length;i++){ if(!weekClosed(i)){ n = i; break; } }
  if(n<0){ toast("Every week is already closed."); return; }
  var d = S.journey.weeks[n];
  WEEKS[n].reqs.forEach(function(r){ d.reqs[r] = true; });
  if(!d.commitments.length){
    d.commitments.push({id:uid(), what:"Complete the week "+n+" action", owner:"Dipti",
      due:todayISO(), evidence:"Notes saved in the Mirror", status:"Complete"});
  }
  if(!nonEmpty(d.energy)) d.energy = String(6 + (n % 4));
  if(!nonEmpty(d.confidence)) d.confidence = String(6 + (n % 3));
  if(!nonEmpty(d.boundary)) d.boundary = "One request declined with an alternative offered.";
  if(!nonEmpty(d.relationship)) d.relationship = "One direct request made to a senior contact.";
  if(!nonEmpty(d.coachSummary)) d.coachSummary = "Week "+n+" closed on evidence. Agreed focus carries into the next week.";
  d.participantConfirmed = true; d.coachClosed = true;
  S.ui.tab[7] = "w" + Math.min(12, n+1);
  toast("Week "+n+" closed. Week "+Math.min(12,n+1)+" is open.");
  if(n<12) notify("Week "+(n+1)+" is now available.");
}

/* ------------------------------- export ---------------------------------- */
function exportJSON(){
  try{
    var payload = {
      product:"WinGroX AI — Individual Growth Intelligence System",
      version:VERSION, exported:new Date().toISOString(),
      note:"Export from browser storage. No cloud copy exists.",
      progress:{overall:overallPct(), steps:STAGES.map(function(s){ return {step:s.n, name:s.name, percent:stepPct(s.n), closed:stepDone(s.n)}; })},
      data:S
    };
    var blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "wingrox-growth-mirror-"+todayISO()+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    window.setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("Your data was downloaded as JSON.");
  }catch(e){
    openModal(modal("Export did not start",
      '<p>This browser blocked the download. Copy the text below instead.</p>'+
      '<textarea style="min-height:200px" readonly>'+esc(JSON.stringify(S))+'</textarea>',
      '<button class="btn" data-act="closeModal">Close</button>'));
  }
}

/* -------------------------------- init ----------------------------------- */
async function initApp(){
  /* Render immediately from localStorage so the user never waits */
  loadState();
  if(!S.ui) S.ui = {stage:1, tab:{}, qIndex:1, notifOpen:false, demoOpen:false};
  if(!S.ui.tab) S.ui.tab = {};
  render();

  /* Background sync with remote — update silently if successful */
  try{
    await loadRemoteState();
    render(); /* re-render with fresh remote data */
  }catch(err){
    /* Remote unavailable — local state already rendered, continue */
  }
}
void initApp();
window.addEventListener("resize", function(){
  var top = $(".hdr") ? $(".hdr").offsetHeight : 0;
  var rmw = $(".rmwrap");
  if(rmw) rmw.style.top = top+"px";
  var m = $("#main");
  if(m) m.style.marginTop = (top + (rmw?rmw.offsetHeight:0) + 12) + "px";
});
window.addEventListener("afterprint", function(){ document.body.classList.remove("printing"); });
</script>
